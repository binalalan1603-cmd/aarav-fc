<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OpenFC 3D - Football Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Loading Screen -->
    <div id="loadingScreen">
        <h1>⚽ OpenFC 3D</h1>
        <p>Loading Stadium...</p>
    </div>


    <!-- Game HUD -->
    <div id="hud">

        <div id="scoreboard">
            BLUE 0 - 0 RED
        </div>

        <div id="matchTime">
            00:00
        </div>

    </div>


    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>


    <!-- Main Game Script -->
    <script type="module" src="main.js"></script>

</body>

</html>
